# Builds the ready-made environment (.devcontainer) and runs the setup check and the full check inside it,
# so "Open in Codespaces" keeps working. Runs when the environment's inputs change, once a month
# (base images and features are updated upstream), and on demand.

name: Ready-made environment

on:
  push:
    branches: [main]
    paths:
      - .devcontainer/**
      - tools/languages.json
      - repo.json
  schedule:
    - cron: '0 3 1 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Build the environment and run the checks inside it
        uses: devcontainers/ci@v0.3
        with:
          push: never
          runCmd: bash setup/check-setup.sh && node tools/check.mjs --branch main
